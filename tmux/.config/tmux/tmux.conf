# Enable Colours
set -g default-terminal 'xterm-256color'
set -as terminal-overrides ',xterm*:sitm=\E[3m'

# Prefix Key
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

##### Neovim CheckHealth Recommendations #####
set-option -sg escape-time 10
set-option -g focus-events on

# Open new windows in current directory path
bind c new-window -c "#{pane_current_path}"

# Split Windows
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload Config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "󰑓 Config reloaded"

# Resize Panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# Enable Mouse
set -g mouse on
set -s set-clipboard on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
unbind -T copy-mode-vi MouseDragEnd1Pane

# Scrollback
set -g history-limit 50000

# VIM motions
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Enable Mouse Dragging
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status Line Position
set-option -g status-position top

# Index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### Auto Save / Restore #####
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

#### THEME ####
# Choose theme and variant
set -g @powerkit_theme "gruvbox"
set -g @powerkit_theme_variant "dark"
set -g @powerkit_transparent "true"
set -g @powerkit_elements_spacing "false"

# Built-in keybindings (all customizable)
set -g @powerkit_keybinding_conflict_action ignore
# Disable theme selector keybinding
set -g @powerkit_theme_selector_key ""

# Enable plugins
set -g @powerkit_plugins 'datetime,weather,cpu,memory,wifi,vpn'

set -g @powerkit_plugin_battery_hide_when_full_and_charging 'true'
# Auto-detect OS icon
set -g @powerkit_session_icon 'auto'

# Weather
set -g @powerkit_plugin_weather_location 'Barreiras,Brazil'
set -g @powerkit_plugin_weather_icon_mode "compact"

# Wifi
set -g @powerkit_plugin_wifi_hide_when_connected "true"

##### Pop-Up: Session List #####
# prefix + w opens a custom tmux menu
bind w display-popup -E -w 30% -h 50% ~/.config/tmux/scripts/tmux-menu.sh

##### Pop-Up: Scratch Pad #####
unbind -T popup Tab # prefix + t opens the scratchpad
bind T display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/tmux-scratch.sh
bind -T popup t send-keys t  # send 't' as a regular keystroke (prevent close)
bind -T popup q send-keys q  # send 'q' as a regular keystroke (prevent close)
bind -T popup T detach
bind -T popup C-[ copy-mode

##### Pop-Up: 
## LazyGit
bind g display-popup -d "#{pane_current_path}" -E -w 80% -h 80% -E lazygit
## LazyDocker
unbind d
bind d display-popup -d "#{pane_current_path}" -E -w 80% -h 80% -E lazydocker
## Posting 
unbind h
bind h display-popup -d "#{pane_current_path}" -E -w 80% -h 80% -E posting

##### Plugins #####
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fabioluciano/tmux-powerkit'

##### TPM Init #####
run '~/.tmux/plugins/tpm/tpm'
